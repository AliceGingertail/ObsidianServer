services:
  postgres:
    image: postgres:15-alpine
    container_name: vpn-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-vpn}
      POSTGRES_USER: ${DB_USER:-vpn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vpn123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../internal/repository/migrations:/docker-entrypoint-initdb.d
    networks:
      - vpn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vpn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  obsidian-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: obsidian-server
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      # Server (host network — порт напрямую на хосте)
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}

      # Database (через published порт postgres на host)
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_USER: ${DB_USER:-vpn}
      DB_PASSWORD: ${DB_PASSWORD:-vpn123}
      DB_NAME: ${DB_NAME:-vpn}
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      # JWT (автогенерируется в entrypoint.sh если не задано)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168}

      # VPN (endpoint автоопределяется если не задано)
      WIREGUARD_ENABLED: "true"
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT:-}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-51821}
      WIREGUARD_SUBNET: ${WIREGUARD_SUBNET:-10.13.13.0/24}
      WIREGUARD_INTERFACE: ${WIREGUARD_INTERFACE:-wg1}
      WIREGUARD_DNS: ${WIREGUARD_DNS:-1.1.1.1, 8.8.8.8}
      MAX_PEERS_PER_USER: ${MAX_PEERS_PER_USER:-5}
    volumes:
      - /lib/modules:/lib/modules:ro
      - wg_config:/etc/wireguard
      - ../../web:/app/web:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  vpn-network:
    driver: bridge

volumes:
  postgres_data:
  wg_config:
