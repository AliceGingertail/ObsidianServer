version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vpn-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-vpn}
      POSTGRES_USER: ${DB_USER:-vpn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vpn123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../internal/repository/migrations:/docker-entrypoint-initdb.d
    networks:
      - vpn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vpn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  obsidian-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: obsidian-server
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vpn}
      DB_PASSWORD: ${DB_PASSWORD:-vpn123}
      DB_NAME: ${DB_NAME:-vpn}
      DB_SSLMODE: disable
      
      # JWT
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15
      JWT_REFRESH_TTL: 168
      
      # VPN
      WIREGUARD_ENABLED: true
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT}
      WIREGUARD_PORT: 51820
      WIREGUARD_SUBNET: 10.13.13.0/24
      MAX_PEERS_PER_USER: 5
    ports:
      - "8081:8080"
      - "51820:51820/udp"
    volumes:
      - /lib/modules:/lib/modules:ro
      - wg_config:/etc/wireguard
      - ../../web:/app/web:ro
    networks:
      - vpn-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  vpn-network:
    driver: bridge

volumes:
  postgres_data:
  wg_config:
