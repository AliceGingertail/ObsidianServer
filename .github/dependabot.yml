version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    target-branch: "dev"

  - package-ecosystem: "docker"
    directory: "/deployments/docker"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "docker"
    target-branch: "dev"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "ci"
    target-branch: "dev"
